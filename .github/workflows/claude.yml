name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # QAF skills (e.g. pr-reviewer) post reviews/comments via gh
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # QAF skills diff against the base branch

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # Browser checks: Playwright MCP (.mcp.json) needs a browser and no display is available in CI.
      # Install the Chromium build matching @playwright/mcp@0.0.37 and run the MCP server headless.
      - name: Set up Playwright MCP for CI (headless Chromium)
        run: |
          npx -y playwright@1.56.0-alpha-2025-09-06 install --with-deps chromium
          jq '.mcpServers.playwright.args += ["--headless","--browser","chromium","--no-sandbox","--isolated"]' .mcp.json > "$RUNNER_TEMP/mcp.json"
          cp "$RUNNER_TEMP/mcp.json" .mcp.json
          git update-index --skip-worktree .mcp.json  # CI-only tweak, never committed

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }} # gh CLI auth for QAF skills (all GitHub operations go through gh)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Tools QAF skills need: gh for GitHub, node/python scripts, pnpm/uv for builds and tests, subagents and skills,
          # plus running the app (start/stop scripts, curl) and checking it in a browser (Playwright MCP)
          claude_args: >-
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(node:*),Bash(python3:*),Bash(pnpm:*),Bash(uv:*),Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(ls:*),Bash(cat:*),Bash(jq:*),Bash(curl:*),Bash(sleep:*),Bash(kill:*),Bash(pkill:*),Bash(lsof:*),Bash(./scripts/start.sh),Bash(./scripts/stop.sh),Read,Write,Edit,Glob,Grep,Task,Skill,mcp__playwright"
            --append-system-prompt "Running in GitHub Actions: gh is authenticated with the workflow GITHUB_TOKEN as github-actions[bot], and gh api user returns 403 for that token. Wherever a skill needs the current GitHub login (e.g. VIEWER in the QAF pr-reviewer pipeline), use github-actions[bot] instead of calling gh api user."

      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7

