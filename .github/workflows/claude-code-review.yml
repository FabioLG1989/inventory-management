name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # pr-reviewer posts a formal review via gh api
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pr-reviewer diffs against the base branch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run QAF PR Reviewer
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }} # gh CLI auth: pr-reviewer fetches the PR and posts the review with gh
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # QAF pr-reviewer skill (.claude/skills/pr-reviewer): parallel specialists + judge, posts one formal review
          prompt: '/pr-reviewer --pr-url https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} --mode automated'
          claude_args: '--allowedTools "Bash(gh:*),Bash(git:*),Bash(node:*),Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(ls:*),Bash(cat:*),Bash(jq:*),Read,Write,Glob,Grep,Task,Skill"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

